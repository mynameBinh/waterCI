
name: Build Unsigned Expo React Native IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Xcode mặc định của macOS 26
      - name: Setup Xcode
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      # 3. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 4. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 5. Check Expo SDK dependencies
      - name: Check Expo dependencies
        run: npx expo install --check

      # 6. Generate native iOS project nếu chưa có
      - name: Generate iOS project
        run: |
          if [ ! -d ios ]; then
            npx expo prebuild --platform ios
          fi

      # 7. Install CocoaPods
      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      # 8. Export JS bundle
      - name: Export Expo bundle
        run: npx expo export --platform ios

      # 9. Build IPA app
      - name: Build iOS (Unsigned)
        run: |
          cd ios

          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$WORKSPACE" ]; then
            echo "ERROR: Không tìm thấy xcworkspace"
            exit 1
          fi

          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" \
            | sed -n '/Schemes:/,$p' \
            | grep -v 'Schemes:' \
            | sed 's/^[[:space:]]*//' \
            | head -n 1)

          if [ -z "$SCHEME" ]; then
            echo "ERROR: Không tìm thấy scheme"
            exit 1
          fi

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # 10. Package IPA
      - name: Package Unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Không tìm thấy file .app"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/expo_unsigned.ipa" Payload

      # 11. Upload artifact
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: expo-unsigned-ipa
          path: expo_unsigned.ipa
          if-no-files-found: error
          retention-days: 7
