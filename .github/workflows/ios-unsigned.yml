
name: Build Unsigned Expo React Native IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    # macOS 15 ARM64 - thay thế macOS 14 đã bị retire
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Initialize Xcode
        run: |
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Expo dependencies
        run: npx expo install --check

      # Nếu project chưa có thư mục ios thì tạo native project
      - name: Generate iOS native project if needed
        run: |
          if [ ! -d "ios" ]; then
            npx expo prebuild --platform ios
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: Export Expo JavaScript bundle
        run: npx expo export --platform ios

      - name: Build iOS app (Unsigned)
        run: |
          cd ios

          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" -print -quit)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" -print -quit)

          if [ -z "$PROJECT" ] || [ -z "$WORKSPACE" ]; then
            echo "Không tìm thấy Xcode project hoặc workspace"
            exit 1
          fi

          SCHEME=$(basename "$PROJECT" .xcodeproj)

          echo "Building scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package Unsigned IPA
        run: |
          APP_DIR="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP_PATH=$(find "$APP_DIR" -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Không tìm thấy file .app"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -r "$GITHUB_WORKSPACE/expo_unsigned.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-unsigned-ipa
          path: expo_unsigned.ipa
          if-no-files-found: error
