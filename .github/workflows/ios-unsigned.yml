name: Build Unsigned Expo React Native IPA (SDK 58)

on:
  push:
  workflow_dispatch:
    inputs:
      prebuild:
        description: "Chạy 'expo prebuild --clean' để sinh lại thư mục ios/ theo SDK 58 (tắt nếu bạn đã tự cập nhật ios/ và commit)"
        type: boolean
        default: true

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Expo SDK 58 cần Xcode >= 26.4 -> dùng runner macOS 26 (Xcode 26.x có sẵn)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CI: "1"
      COCOAPODS_DISABLE_STATS: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # SDK 58 yêu cầu Xcode 26.4 trở lên. '^26.4' = bản 26.x mới nhất (>= 26.4), không nhảy sang Xcode 27.
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "^26.4"

      - name: Show Xcode / SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # Giữ lại: khởi tạo CoreSimulator / platform để tránh lỗi "Platform Not Installed"
      - name: Initialize Apple CoreSimulator Service
        run: |
          xcrun simctl list runtimes
          sudo xcodebuild -runFirstLaunch

      # SDK 58 (React Native 0.88) cần Node >= 22.13 (nhánh 22), >= 24.3 (nhánh 24) hoặc Node 26
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show tool versions
        run: |
          node -v
          npm -v
          pod --version

      - name: Install JavaScript Dependencies
        run: |
          if [ -f "yarn.lock" ]; then
            yarn install --frozen-lockfile
          elif [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      # Dùng Expo CLI cục bộ (npx expo) – KHÔNG cài expo-cli toàn cục (gói cũ, đã bị bỏ)
      - name: Check Expo dependencies (non-blocking)
        run: npx expo-doctor@latest || true

      - name: Fix Expo Dependencies Mismatch
        run: npx expo install --fix

      # Thư mục ios/ cũ được sinh từ SDK 54 (Podfile, AppDelegate, project.pbxproj...) nên
      # không tương thích React Native 0.88 -> sinh lại hoàn toàn theo SDK 58.
      - name: Regenerate native iOS project (prebuild)
        if: ${{ github.event.inputs.prebuild != 'false' }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install Cocoapods
        working-directory: ios
        run: pod install

      - name: Build Xcode Project (Unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Workspace: $WORKSPACE | Scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | (command -v xcbeautify >/dev/null && xcbeautify --quieter || cat)

      - name: Pack Unsigned IPA
        working-directory: ios
        run: |
          APP_PATH=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "App: $APP_PATH"
          rm -rf Payload expo_unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry expo_unsigned.ipa Payload
          ls -lh expo_unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expo-unsigned-ipa
          path: ios/expo_unsigned.ipa
          if-no-files-found: error
          retention-days: 14